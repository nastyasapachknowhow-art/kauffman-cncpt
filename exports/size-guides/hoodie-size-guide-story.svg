    <g font-size="28"><text x="70" y="600">Cloth length <tspan font-size="18" letter-spacing="2">CM</tspan></text><text x="555" y="600" text-anchor="middle">64</text><text x="755" y="600" text-anchor="middle">67</text><text x="955" y="600" text-anchor="middle">70</text>
