<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs><style><![CDATA[.title { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; }]]></style></defs>
  <rect width="1080" height="1920" fill="#ffffff"/>
  <g fill="#171717" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="300">
    <text class="title" x="70" y="210" font-size="104">T-Shirt</text>
    <text x="74" y="282" font-size="23" fill="#666" letter-spacing="4">CRYSTAL COLLECTION</text>
    <text x="70" y="365" font-size="28" fill="#5f5f5f">Measurements are taken from the garment laid flat.</text>
    <text x="70" y="405" font-size="28" fill="#5f5f5f">All measurements are in centimetres.</text>
    <line x1="70" y1="480" x2="1010" y2="480" stroke="#171717" stroke-width="3"/>
    <g font-size="26" letter-spacing="2"><text x="70" y="552">MEASUREMENT</text><text x="555" y="552" text-anchor="middle">S</text><text x="755" y="552" text-anchor="middle">M</text><text x="955" y="552" text-anchor="middle">L</text></g>
    <g stroke="#bebebe" stroke-width="2"><line x1="70" y1="604" x2="1010" y2="604"/><line x1="70" y1="770" x2="1010" y2="770"/><line x1="70" y1="936" x2="1010" y2="936"/><line x1="70" y1="1102" x2="1010" y2="1102"/><line x1="70" y1="1268" x2="1010" y2="1268"/></g>
    <g font-size="31"><text x="70" y="700">Clothes length <tspan font-size="20" letter-spacing="2">CM</tspan></text><text x="555" y="700" text-anchor="middle">68</text><text x="755" y="700" text-anchor="middle">71</text><text x="955" y="700" text-anchor="middle">74</text>
      <text x="70" y="866">Shoulder width <tspan font-size="20" letter-spacing="2">CM</tspan></text><text x="555" y="866" text-anchor="middle">52</text><text x="755" y="866" text-anchor="middle">55</text><text x="955" y="866" text-anchor="middle">58</text>
      <text x="70" y="1032">Chest width <tspan font-size="20" letter-spacing="2">CM</tspan></text><text x="555" y="1032" text-anchor="middle">53</text><text x="755" y="1032" text-anchor="middle">56</text><text x="955" y="1032" text-anchor="middle">59</text>
      <text x="70" y="1198">Sleeve length <tspan font-size="20" letter-spacing="2">CM</tspan></text><text x="555" y="1198" text-anchor="middle">20</text><text x="755" y="1198" text-anchor="middle">21.5</text><text x="955" y="1198" text-anchor="middle">23</text></g>
    <line x1="70" y1="1650" x2="1010" y2="1650" stroke="#bebebe" stroke-width="2"/>
    <text x="70" y="1725" font-size="24" fill="#666">Size guide · Kauffman Concept</text>
  </g>
