<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
  <defs><style><![CDATA[.size-guide-title { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; }]]></style></defs>
  <rect width="2400" height="1800" fill="#ffffff"/>
  <g fill="#171717" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="300">
    <text class="size-guide-title" x="160" y="190" font-size="112">Hoodie</text>
    <text x="160" y="278" font-size="35" fill="#5f5f5f">Measurements are taken from the garment laid flat. All measurements are in centimetres.</text>
    <line x1="160" y1="360" x2="2240" y2="360" stroke="#171717" stroke-width="4"/>
    <g font-size="34" font-weight="300" letter-spacing="3">
      <text x="160" y="442">MEASUREMENT</text><text x="1005" y="442" text-anchor="middle">S</text><text x="1450" y="442" text-anchor="middle">M</text><text x="1895" y="442" text-anchor="middle">L</text>
    </g>
    <g stroke="#bebebe" stroke-width="3"><line x1="160" y1="500" x2="2240" y2="500"/><line x1="160" y1="650" x2="2240" y2="650"/><line x1="160" y1="800" x2="2240" y2="800"/><line x1="160" y1="950" x2="2240" y2="950"/><line x1="160" y1="1100" x2="2240" y2="1100"/><line x1="160" y1="1250" x2="2240" y2="1250"/><line x1="160" y1="1400" x2="2240" y2="1400"/><line x1="160" y1="1550" x2="2240" y2="1550"/></g>
    <g font-size="42"><text x="160" y="590" font-weight="300">Cloth length <tspan font-size="25" font-weight="300" letter-spacing="2">CM</tspan></text><text x="1005" y="590" text-anchor="middle">64</text><text x="1450" y="590" text-anchor="middle">67</text><text x="1895" y="590" text-anchor="middle">70</text>
      <text x="160" y="740" font-weight="300">Chest <tspan font-size="25" font-weight="300" letter-spacing="2">CM</tspan></text><text x="1005" y="740" text-anchor="middle">122</text><text x="1450" y="740" text-anchor="middle">126</text><text x="1895" y="740" text-anchor="middle">130</text>
      <text x="160" y="890" font-weight="300">Shoulder <tspan font-size="25" font-weight="300" letter-spacing="2">CM</tspan></text><text x="1005" y="890" text-anchor="middle">60</text><text x="1450" y="890" text-anchor="middle">62</text><text x="1895" y="890" text-anchor="middle">64</text>
      <text x="160" y="1040" font-weight="300">Sleeve length <tspan font-size="25" font-weight="300" letter-spacing="2">CM</tspan></text><text x="1005" y="1040" text-anchor="middle">57</text><text x="1450" y="1040" text-anchor="middle">58</text><text x="1895" y="1040" text-anchor="middle">59</text>
      <text x="160" y="1190" font-weight="300">Hem <tspan font-size="25" font-weight="300" letter-spacing="2">CM</tspan></text><text x="1005" y="1190" text-anchor="middle">55</text><text x="1450" y="1190" text-anchor="middle">56</text><text x="1895" y="1190" text-anchor="middle">58</text></g>
    <g fill="#f7f7f7"><rect x="160" y="1252" width="2080" height="148"/><rect x="160" y="1402" width="2080" height="148"/></g>
    <g font-size="42"><text x="160" y="1342" font-weight="300">Hood width <tspan font-size="25" font-weight="300" letter-spacing="2">CM</tspan></text><text x="1200" y="1342" text-anchor="middle">29 <tspan font-size="22" fill="#666" letter-spacing="2">ALL SIZES</tspan></text><text x="160" y="1492" font-weight="300">Hood length <tspan font-size="25" font-weight="300" letter-spacing="2">CM</tspan></text><text x="1200" y="1492" text-anchor="middle">39 <tspan font-size="22" fill="#666" letter-spacing="2">ALL SIZES</tspan></text></g>
    <text x="160" y="1680" font-size="28" fill="#666">Size guide · Kauffman Concept</text>
